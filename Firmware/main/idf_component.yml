## Component manager manifest：IDF 5.5 不内置 lvgl，经 registry 拉取
## （software-design 四：LVGL 9 用于菜单/气泡 UI 层）
dependencies:
  lvgl/lvgl: "^9"
  waveshare/esp32_s3_touch_amoled_2_16: "^2.0.1"
  ## LCD-1.85B 板面板驱动（MP_BOARD_LCD185B 构建用；216 构建下无人引用，
  ## 链接器 GC 剔除，旧板产物不变）
  espressif/esp_lcd_st77916: "^2.0.2"
  ## E14 mDNS：IDF 5.5 不内置 mdns（sdkconfig 里的 CONFIG_LWIP_DNS_SUPPORT_MDNS_QUERIES
  ## 只是 DNS 解析，不是服务发现），服务发现能力由 registry 组件提供。
  ## 约束 "^1.2.2" 实际解析到 1.13.1（见 dependencies.lock，该文件 gitignore）；
  ## 代码只依赖 mdns_init/mdns_free/mdns_query_ptr/mdns_query_a 与 mdns_result_t
  ## 的 hostname/port/addr 字段 —— 这些在 1.2.2 → 1.13.1 之间签名未变（已比对
  ## 两个版本的头文件 + 编译验证）。
  espressif/mdns: "^1.2.2"
  idf: ">=5.5"
