const PAGES = {"root": {"title": "\u4e3b\u83dc\u5355", "parent": null, "items": ["\u5730\u56fe", "\u7eb8\u5a03\u5a03", "BGM", "\u9000\u51fa"]}, "map": {"title": "\u9009\u62e9\u5730\u56fe", "parent": "root", "items": ["\u5c04\u624b\u6751", "\u660e\u73e0\u6e2f", "\u5929\u7a7a\u4e4b\u57ce", "\u795e\u79d8\u5c9b"]}, "act": {"title": "\u9009\u62e9\u52a8\u4f5c", "parent": "root", "items": ["\u7ad9\u7acb", "\u884c\u8d70", "\u5954\u8dd1", "\u8df3\u8dc3", "\u6253\u62db\u547c", "\u7761\u89c9", "\u6447\u5934", "\u8f6c\u5708"]}, "bgm": {"title": "BGM \u63a7\u5236", "parent": "root", "items": ["\u64ad\u653e", "\u6682\u505c", "\u4e0a\u4e00\u9996", "\u4e0b\u4e00\u9996", "\u97f3\u91cf +", "\u97f3\u91cf \u2212"]}};
function makeRoller(tag, visN) {
  const lane = document.getElementById('l-'+tag), roller = document.getElementById('r-'+tag),
        sel = document.getElementById('sel-'+tag), thumb = document.getElementById('th-'+tag),
        status = document.getElementById('st-'+tag), title = document.getElementById('tt-'+tag);
  let N = 4, pos = 4, v = 0, dragging = false, lastY = 0, lastT = 0, moved = 0, downT = 0,
      mode = 'snap', page = 'root', rowH = 50;
  const imod = i => ((i % N) + N) % N;
  function anchor(){ while(pos < N) pos += N; while(pos >= 2*N) pos -= N; }
  function layout(){
    rowH = roller.clientHeight / visN;
    sel.style.top = (visN >> 1) * rowH + 1 + 'px';
    sel.style.height = rowH - 2 + 'px';
  }
  function build(p){
    page = p; N = PAGES[p].items.length;
    lane.innerHTML = PAGES[p].items.concat(PAGES[p].items, PAGES[p].items).map(nm =>
      '<div class="row" style="height:'+rowH+'px"><span class="dot"></span><span class="nm">'+nm+'</span></div>').join('');
    pos = N; v = 0; mode = 'snap'; title.textContent = PAGES[p].title;
  }
  function render(){
    anchor();
    lane.style.transform = 'translateY(' + (-pos*rowH + visN/2*rowH - rowH/2) + 'px)';
    const t = imod(Math.round(pos));
    thumb.style.height = Math.max(16, visN/N*100) + '%';
    thumb.style.top = (t / N * 100) + '%';
    status.textContent = '当前选中：' + PAGES[page].items[t];
    return t;
  }
  function confirm(){
    const t = imod(Math.round(pos)), nm = PAGES[page].items[t];
    sel.animate([{boxShadow:'0 2px 10px rgba(90,64,32,.3)'},{boxShadow:'0 0 26px rgba(217,169,63,.9)'},{boxShadow:'0 2px 10px rgba(90,64,32,.3)'}],{duration:300});
    if (page === 'root') {
      if (nm === '退出') { status.textContent = '返回宠物页（演示）'; return; }
      build(nm === '地图' ? 'map' : nm === '纸娃娃' ? 'act' : 'bgm');
      render(); status.textContent = PAGES[page].title;
    } else {
      status.textContent = '✅ 已应用：' + nm;
      const back = page; build('root'); render();
      status.textContent = '✅ 已应用：' + nm + '（' + PAGES[back].title + '）';
    }
  }
  function back(){
    if (page === 'root') { status.textContent = '已在主菜单'; return; }
    build(PAGES[page].parent); render(); status.textContent = '已返回';
  }
  roller.addEventListener('mousedown', e => {
    dragging = true; moved = 0; downT = performance.now();
    lastY = e.clientY; lastT = performance.now(); v = 0; e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dy = e.clientY - lastY, dt = performance.now() - lastT;
    if (dt > 0) v = 0.7*v + 0.3*(-dy/rowH/dt*16);
    pos += -dy/rowH; moved += Math.abs(dy);
    lastY = e.clientY; lastT = performance.now(); render();
  });
  window.addEventListener('mouseup', e => {
    if (!dragging) return; dragging = false;
    if (moved < 10 && performance.now() - downT < 300) {
      const rect = roller.getBoundingClientRect();
      const k = Math.floor((e.clientY - rect.top) / rowH), center = visN >> 1;
      if (k === center) confirm(); else { pos = Math.round(pos) + (k - center); mode = 'snap'; render(); }
      return;
    }
    mode = 'coast';
  });
  roller.addEventListener('wheel', e => { e.preventDefault(); pos += (e.deltaY > 0 ? 1 : -1); mode = 'coast'; render(); }, {passive:false});
  document.getElementById('ok-'+tag).onclick = () => confirm();
  document.getElementById('cc-'+tag).onclick = () => back();
  document.getElementById('at-'+tag).onclick = () => { pos = Math.round(pos) - 1; mode = 'snap'; render(); };
  document.getElementById('ab-'+tag).onclick = () => { pos = Math.round(pos) + 1; mode = 'snap'; render(); };
  let last = performance.now();
  (function tick(now){
    const dt = Math.min(50, now - last); last = now;
    if (mode === 'coast') {
      pos += v * dt/16; v *= Math.exp(-dt/409);
      if (Math.abs(v) < 0.02) mode = 'snap';
    } else if (mode === 'snap' && !dragging) {
      const tgt = Math.round(pos);
      pos += (tgt - pos) * (1 - Math.exp(-dt/70));
      if (Math.abs(tgt - pos) < 0.002) pos = tgt;
    }
    render(); requestAnimationFrame(tick);
  })(last);
  layout(); build('root'); render();
  window.addEventListener('resize', () => { layout(); render(); });
}
makeRoller('sq', 5);
makeRoller('rd', 3);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp')   { document.getElementById('at-sq').click(); document.getElementById('at-rd').click(); }
  if (e.key === 'ArrowDown') { document.getElementById('ab-sq').click(); document.getElementById('ab-rd').click(); }
  if (e.key === 'Enter')     document.getElementById('ok-sq').click();
  if (e.key === 'Escape')    document.getElementById('cc-sq').click();
});
